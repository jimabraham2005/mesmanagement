{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Complaint | Student</title>
    <link rel="stylesheet" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="{% url 'studentdashboard' %}">Student Dashboard</a>
</nav>

<div class="container my-5">
    <h3 class="mb-4">Submit Complaint / Feedback</h3>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea name="message" class="form-control" rows="4" required></textarea>
        </div>

        <button class="btn btn-success">Submit</button>
        <a href="{% url 'studentdashboard' %}" class="btn btn-secondary">Back</a>
    </form>
</div>

</body>
</html>
