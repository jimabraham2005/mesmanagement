{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Warden</title>
    <link rel="stylesheet" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="{% url 'admin_dashboard' %}">Admin Dashboard</a>
</nav>

<div class="container mt-5">
    <h3 class="text-center mb-4">Add Warden</h3>

    <div class="card shadow">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <div>
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                
                <div class="form-group">
                    <label>Phone (optional)</label>
                    <input type="text" name="phone" class="form-control">
                </div>

                <button class="btn btn-success w-100">Create Warden</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
