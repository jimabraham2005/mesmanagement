{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Mess Portal</title>
    <link rel="stylesheet" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .reg-card {
            background: rgba(255, 255, 255, 1);
            border-radius: 30px;
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                scale: 0.95;
            }

            to {
                opacity: 1;
                scale: 1;
            }
        }

        .reg-header {
            background: #2c3e50;
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .reg-header h2 {
            font-weight: 600;
            margin: 0;
            font-size: 28px;
        }

        .reg-header p {
            margin: 10px 0 0;
            opacity: 0.8;
            font-size: 15px;
        }

        .reg-body {
            padding: 40px;
        }

        .form-section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #2c5364;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .form-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
            margin-left: 15px;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #f0f0f0;
            padding: 12px 16px;
            height: auto;
            transition: all 0.3s;
            background: #fdfdfd;
        }

        .form-control:focus {
            border-color: #2c5364;
            box-shadow: none;
            background: white;
        }

        .btn-register {
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
            font-size: 16px;
        }

        .btn-register:hover {
            background: #1a252f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #2c5364;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .login-link a:hover {
            color: #1a3a47;
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .row .col-md-6 {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="reg-card">
        <div class="reg-header">
            <h2>Student Enrollment</h2>
            <p>Join the hostel mess management system</p>
        </div>

        <div class="reg-body">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-warning">
                <i class="fa fa-info-circle mr-2"></i> {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-section-title">Credentials</div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" placeholder="e.g. john_doe"
                                required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <div class="form-section-title mt-4">Personal Details</div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Register Number</label>
                            <input type="text" name="reg_no" class="form-control" placeholder="ABC12345" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" class="form-control" placeholder="CS / IT / ME"
                                required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Room Number</label>
                            <input type="text" name="room_no" class="form-control" placeholder="B-204" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-register">
                    Complete Registration <i class="fa fa-check-circle ml-2"></i>
                </button>
            </form>

            <div class="login-link">
                Already registered? <a href="{% url 'login' %}">Login to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'styles/bootstrap4/bootstrap.min.js' %}"></script>
</body>

</html>
