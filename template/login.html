{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hostel Mess Management</title>
    <link rel="stylesheet" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/font-awesome-4.7.0/css/font-awesome.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            background: #2a5298;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(42, 82, 152, 0.3);
        }

        h2 {
            text-align: center;
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
            font-size: 14px;
            margin-left: 4px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            height: auto;
            border: 2px solid #eee;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #2a5298;
            box-shadow: none;
            background: #fff;
        }

        .btn-login {
            background: #2a5298;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            margin-top: 16px;
            transition: all 0.3s;
            color: white;
        }

        .btn-login:hover {
            background: #1e3c72;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(42, 82, 152, 0.3);
            color: white;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #2a5298;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .register-link a:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fa fa-cutlery"></i>
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Access the Hostel Mess Portal</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            <i class="fa fa-exclamation-circle mr-2"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <div class="position-relative">
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="form-group mb-4">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login">
                Login <i class="fa fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div class="register-link">
            Are you a new student? <a href="{% url 'register' %}">Join the Mess</a>
        </div>
    </div>

    <script src="{% static 'js/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'styles/bootstrap4/bootstrap.min.js' %}"></script>
</body>

</html>
